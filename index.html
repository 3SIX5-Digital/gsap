<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Wheel Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="toggle-container">
            <label class="switch">
                <input type="checkbox" id="mode-toggle">
                <span class="slider"></span>
            </label>
            <span class="toggle-label">Switch to Spinning Wheel</span>
        </div>
        <div class="grid-container">
            <!-- Items will be generated by JavaScript -->
        </div>
        <button id="spin-button">Spin the Wheel!</button>
    </div>

    <div class="modal" id="challenge-modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="challenge-details"></div>
            <button id="respin-button">Respin</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/Flip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
